<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido recebido — HEKTOR</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  :root{--fundo:#0F171F; --card:#162029; --texto:#E8EAED; --sub:#8A949C;
        --acento:#3DCFB4; --run:#3DCFB4}
  *{box-sizing:border-box}
  body{margin:0; background:var(--fundo); color:var(--texto);
       font:16px/1.7 'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;
       display:flex; align-items:center; justify-content:center; min-height:100vh}
  .caixa{max-width:520px; padding:40px 24px; text-align:center}
  .marca{color:var(--sub); font-size:13px; letter-spacing:2px; font-weight:700; margin-bottom:32px}
  .certo{width:56px; height:56px; margin:0 auto 22px; border-radius:50%;
         background:rgba(61,207,180,.14); color:var(--run);
         display:flex; align-items:center; justify-content:center; font-size:28px}
  h1{font-size:27px; margin:0 0 14px; letter-spacing:-.4px}
  p{color:var(--sub); margin:0 0 12px}
  .voltar{display:inline-block; margin-top:26px; color:var(--acento); text-decoration:none; font-size:15px}
  .voltar:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="caixa">
    <div class="marca">HEKTOR</div>
    <div class="certo">✓</div>
    <h1>Pedido recebido</h1>
    <p>Obrigado pelo interesse no Hektor Vision.</p>
    <p>Respondo pessoalmente, normalmente em até um dia útil.</p>
    <a class="voltar" href="/">← Voltar ao site</a>
  </div>
</body>
</html>
